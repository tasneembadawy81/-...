<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقويم الدرس: نظام التشغيل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="top-bar">
      <span class="lesson-label">تقويم الدرس:</span>
      <span id="counter"></span>
    </div>

    <div class="progress"><div id="progressFill"></div></div>

    <div class="card" id="questionCard">
      <span class="badge" id="qType"></span>
      <h2 id="qText"></h2>
      <div id="optionsBox"></div>
      <div id="feedback" class="feedback hidden"></div>
    </div>

    <div class="nav" id="navBar">
      <button id="prevBtn" class="btn-yellow">السابق</button>
      <button id="nextBtn" class="btn-yellow">التالي</button>
    </div>

    <div class="card hidden" id="resultCard">
      <h2>انتهى الاختبار 🎉</h2>
      <p class="score" id="scoreText"></p>
      <p id="scoreMessage"></p>
      <button id="restartBtn" class="btn-yellow">إعادة الاختبار</button>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
